<!DOCTYPE html>
<html lang="en">
<head>

    <title>FinTastic Vacations</title>
    <link rel="stylesheet" href="styles.css">
</head>

                <div class="destination-card">
                    <h3>Mountain Retreat</h3>

                    <h3>City Explorer</h3>

    </main>
    <footer>

    </footer>
    <script src="app.js"></script>
